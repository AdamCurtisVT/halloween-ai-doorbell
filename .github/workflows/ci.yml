name: Doorbell checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: python -m scripts.simulate
      - run: docker compose config --no-env-resolution --quiet
      - run: docker compose -f docker-compose.secrets.yml config --quiet
        env:
          UNIFI_HOST: example.invalid
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t doorbell:ci .
      - name: Verify restricted container and media tools
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m
          --cap-drop ALL --security-opt no-new-privileges:true doorbell:ci
          python -c 'import os, shutil; from fastapi.testclient import TestClient; from app.main import app; assert os.getuid() == 10001; assert shutil.which("ffmpeg") and shutil.which("ffprobe"); assert TestClient(app).get("/health").status_code == 200'

      - name: Exercise real HTTP server with isolated disabled configuration
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m
          --cap-drop ALL --security-opt no-new-privileges:true doorbell:ci
          python -m scripts.smoke_server --dual-listener
