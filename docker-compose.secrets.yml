# Optional HA/microphone secret mounts are separate override files.
# Standalone alternative: docker compose -f docker-compose.secrets.yml up --build -d
services:
  doorbell:
    build: .
    environment:
      UNIFI_HOST: ${UNIFI_HOST:?Set UNIFI_HOST in .env or your environment}
      UNIFI_PORT: ${UNIFI_PORT:-443}
      UNIFI_CAMERA_ID: ${UNIFI_CAMERA_ID:-}
      UNIFI_VERIFY_SSL: 'true'
      UNIFI_USERNAME_FILE: /run/secrets/unifi_username
      UNIFI_PASSWORD_FILE: /run/secrets/unifi_password
      UNIFI_API_KEY_FILE: /run/secrets/unifi_api_key
      CONTROL_API_TOKEN_FILE: /run/secrets/control_api_token
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      UNIFI_WEBHOOK_TOKEN_FILE: /run/secrets/unifi_webhook_token
      TRIGGER_SOURCE: ${TRIGGER_SOURCE:-webhook}
      UNIFI_WEBHOOK_ALLOWED_CAMERA_IDS: ${UNIFI_WEBHOOK_ALLOWED_CAMERA_IDS:-}
      UNIFI_WEBHOOK_ALLOWED_SOURCE_IPS: ${UNIFI_WEBHOOK_ALLOWED_SOURCE_IPS:-}
      UNIFI_WEBHOOK_ALLOWED_ALARM_NAMES: ${UNIFI_WEBHOOK_ALLOWED_ALARM_NAMES:-}
      UNIFI_WEBHOOK_ALLOWED_TRIGGERS: ${UNIFI_WEBHOOK_ALLOWED_TRIGGERS:-}
      UNIFI_WEBHOOK_TOKEN_HEADER: ${UNIFI_WEBHOOK_TOKEN_HEADER:-X-Unifi-Token}
      UNIFI_WEBHOOK_MAX_BODY_BYTES: ${UNIFI_WEBHOOK_MAX_BODY_BYTES:-16384}
      UNIFI_WEBHOOK_MAX_SKEW_SECONDS: ${UNIFI_WEBHOOK_MAX_SKEW_SECONDS:-120}
      UNIFI_WEBHOOK_DEDUPE_SECONDS: ${UNIFI_WEBHOOK_DEDUPE_SECONDS:-10}
      UNIFI_WEBHOOK_QUEUE_SIZE: ${UNIFI_WEBHOOK_QUEUE_SIZE:-32}
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-http://homeassistant.local:8123}
      EFFECTS_ENABLED: ${EFFECTS_ENABLED:-true}
      HUE_ARRIVAL_SCENE: ${HUE_ARRIVAL_SCENE:-}
      HUE_SCENE_SCOPE_CONFIRMED: ${HUE_SCENE_SCOPE_CONFIRMED:-false}
      HUE_CONTROLLED_ENTITIES: ${HUE_CONTROLLED_ENTITIES:-}
      EFFECTS_SPEAKER_ENABLED: ${EFFECTS_SPEAKER_ENABLED:-false}
      EFFECTS_SPEAKER_DEDICATED: ${EFFECTS_SPEAKER_DEDICATED:-false}
      EFFECTS_SPEAKER_ENTITY_ID: ${EFFECTS_SPEAKER_ENTITY_ID:-}
      EFFECTS_SOUND_URL: ${EFFECTS_SOUND_URL:-}
      EFFECTS_MAX_VOLUME: ${EFFECTS_MAX_VOLUME:-0.30}
      EFFECTS_MAX_DURATION_SECONDS: ${EFFECTS_MAX_DURATION_SECONDS:-4}
      EFFECTS_QUIET_HOURS: ${EFFECTS_QUIET_HOURS-22:00-09:00}
      EFFECTS_TIMEZONE: ${EFFECTS_TIMEZONE:-America/New_York}
      EFFECTS_TIMEOUT_SECONDS: ${EFFECTS_TIMEOUT_SECONDS:-3}
      EFFECTS_LIFECYCLE_TIMEOUT_SECONDS: ${EFFECTS_LIFECYCLE_TIMEOUT_SECONDS:-8}
      EFFECTS_TRANSITION_SECONDS: ${EFFECTS_TRANSITION_SECONDS:-1}
      FEATURE_ENABLED: ${FEATURE_ENABLED:-false}
      CONVERSATION_MODE: ${CONVERSATION_MODE:-greeting_only}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_DETAIL: ${VISION_DETAIL:-high}
      DIALOGUE_MODEL: ${DIALOGUE_MODEL:-}
      STT_MODEL: ${STT_MODEL:-}
      TTS_MODEL: ${TTS_MODEL:-}
      MODERATION_MODEL: ${MODERATION_MODEL:-}
      TTS_VOICE: ${TTS_VOICE:-alloy}
      PERSONALITY: ${PERSONALITY:-haunted_butler}
      SNAPSHOT_COUNT: ${SNAPSHOT_COUNT:-3}
      SNAPSHOT_INTERVAL_SECONDS: ${SNAPSHOT_INTERVAL_SECONDS:-0.2}
      VAD_AGGRESSIVENESS: ${VAD_AGGRESSIVENESS:-2}
      VAD_ONSET_MS: ${VAD_ONSET_MS:-210}
      VAD_SILENCE_MS: ${VAD_SILENCE_MS:-720}
      FALLBACK_WAV: ${FALLBACK_WAV:-}
      GOODBYE_WAV: ${GOODBYE_WAV:-}
      ARRIVAL_WAV: ${ARRIVAL_WAV:-}
      MAX_VISITOR_REPLIES: ${MAX_VISITOR_REPLIES:-3}
      LISTEN_TIMEOUT_SECONDS: ${LISTEN_TIMEOUT_SECONDS:-8}
      MAX_SESSION_SECONDS: ${MAX_SESSION_SECONDS:-45}
      MIN_TURN_SECONDS: ${MIN_TURN_SECONDS:-12}
      GOODBYE_RESERVE_SECONDS: ${GOODBYE_RESERVE_SECONDS:-6}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-10}
      PLAYBACK_TIMEOUT_SECONDS: ${PLAYBACK_TIMEOUT_SECONDS:-20}
      COOLDOWN_SECONDS: ${COOLDOWN_SECONDS:-30}
      PORCH_CLEAR_SECONDS: ${PORCH_CLEAR_SECONDS:-10}
      AUDIO_ECHO_GUARD_MS: ${AUDIO_ECHO_GUARD_MS:-400}
    secrets:
      - unifi_username
      - unifi_password
      - unifi_api_key
      - control_api_token
      - openai_api_key
      - unifi_webhook_token
    ports: ['127.0.0.1:8000:8000', '${DOCKER_LAN_IP:-127.0.0.1}:8080:8080']
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: 'on-failure:3'
    stop_grace_period: 60s
secrets:
  unifi_username:
    file: ./secrets/unifi_username
  unifi_password:
    file: ./secrets/unifi_password
  unifi_api_key:
    file: ./secrets/unifi_api_key
  control_api_token:
    file: ./secrets/control_api_token
  openai_api_key:
    file: ./secrets/openai_api_key
  unifi_webhook_token:
    file: ./secrets/unifi_webhook_token
