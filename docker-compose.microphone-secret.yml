# Add to docker-compose.secrets.yml for interactive mode using a mounted stream URL.
services:
  doorbell:
    environment:
      UNIFI_AUDIO_STREAM_URL_FILE: /run/secrets/unifi_audio_stream_url
    secrets:
      - unifi_audio_stream_url
secrets:
  unifi_audio_stream_url:
    file: ./secrets/unifi_audio_stream_url
