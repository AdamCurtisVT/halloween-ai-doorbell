services:
  doorbell:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
      - "${DOCKER_LAN_IP:-127.0.0.1}:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: "on-failure:3"
    stop_grace_period: 60s
